# prefix key that doesn't conflict with emacs, and is still easy to
# press on ours keyboard for termux
unbind C-b
set -g prefix C-z
bind C-z send-prefix


set -g mouse on
# The default copy-selection-and-cancel binding exits copy mode after a mouse
# selection, which jumps the pane back to the live bottom.
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection

# Pass clipboard writes (OSC 52) from programs inside tmux on to the terminal.
# The default, "external", only sends tmux's own copies and drops the rest, so
# copying from nvim, Claude Code, or anything running over ssh (including a
# remote tmux) never reached the clipboard. Programs can set the clipboard this
# way but not read it.
set -g set-clipboard on

bind r source-file ~/.tmux.conf \; display-message "config reloaded"

set -g history-limit 100000

# tmux waits 500ms after Esc to see if it's the start of a function-key sequence,
# this makes it feel laggy
set -sg escape-time 10

# some programs like to know when they gain/lose focus
set -g focus-events on

# settings needed for shift+enter to work in agent interfaces
set -g allow-passthrough on
set -s extended-keys always
set -s extended-keys-format csi-u # needed for shift+enter to work
set -as terminal-features '*:extkeys'
set -as terminal-features 'xterm*:hyperlinks'

# The Svalboard's key override turns Shift+Backspace into Delete, so
# Ctrl+Shift+Backspace arrives as Ctrl+Delete, which GUI apps treat as
# delete-next-word. Claude Code's prompt deletes only one character for it,
# and its keybindings have no action to change that, so give it Alt+D, its
# delete-next-word, instead. Other programs get Ctrl+Delete unchanged (bash
# already binds it to kill-word).
bind -n C-DC if -F '#{==:#{pane_current_command},claude}' 'send-keys M-d' 'send-keys C-DC'

# makes window size track most recent client to look at window
setw -g aggressive-resize on

# tmux 3.8 draws the status line etc. with built-in light/dark themes; use
# the terminal's own ANSI colours (Ghostty's palette) as before.
set -s theme terminal

# Remember the window most recently looked at in any terminal, so that an
# ssh login can start on it (see t in shell/bashrc).
set-hook -g client-focus-in "set-option -gF @last_window '#{window_id}'"
set-hook -g session-window-changed "set-option -gF @last_window '#{window_id}'"